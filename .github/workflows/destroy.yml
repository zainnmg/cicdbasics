name: Destroy AWS Resources

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: learning-app
  ECS_CLUSTER: learning-cluster
  ECS_SERVICE: learning-app-service
  ECS_TASK_FAMILY: learning-app
  LOG_GROUP: /ecs/learning-app

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::641250539814:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete ECS service and stop tasks
        run: |
          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' \
            --output text)

          if [ "$CLUSTER_STATUS" = "ACTIVE" ]; then
            SERVICE_COUNT=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'length(services[?status!=`INACTIVE`])' \
              --output text)

            if [ "$SERVICE_COUNT" != "0" ]; then
              aws ecs update-service \
                --cluster "$ECS_CLUSTER" \
                --service "$ECS_SERVICE" \
                --desired-count 0

              aws ecs delete-service \
                --cluster "$ECS_CLUSTER" \
                --service "$ECS_SERVICE" \
                --force
            fi

            TASK_ARNS=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --query 'taskArns' \
              --output text)

            if [ -n "$TASK_ARNS" ]; then
              for TASK_ARN in $TASK_ARNS; do
                aws ecs stop-task \
                  --cluster "$ECS_CLUSTER" \
                  --task "$TASK_ARN" \
                  --reason "Destroyed by GitHub Actions destroy workflow"
              done

              aws ecs wait tasks-stopped \
                --cluster "$ECS_CLUSTER" \
                --tasks $TASK_ARNS
            fi
          fi

      - name: Delete ECS cluster
        run: |
          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].status' \
            --output text)

          if [ "$CLUSTER_STATUS" = "ACTIVE" ]; then
            aws ecs delete-cluster --cluster "$ECS_CLUSTER"
          fi

      - name: Deregister ECS task definitions
        run: |
          TASK_DEFINITIONS=$(aws ecs list-task-definitions \
            --family-prefix "$ECS_TASK_FAMILY" \
            --status ACTIVE \
            --query 'taskDefinitionArns' \
            --output text)

          if [ -n "$TASK_DEFINITIONS" ]; then
            for TASK_DEFINITION in $TASK_DEFINITIONS; do
              aws ecs deregister-task-definition \
                --task-definition "$TASK_DEFINITION"
            done
          fi

      - name: Delete CloudWatch log group
        run: |
          LOG_GROUP_EXISTS=$(aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP" \
            --query "length(logGroups[?logGroupName=='$LOG_GROUP'])" \
            --output text)

          if [ "$LOG_GROUP_EXISTS" != "0" ]; then
            aws logs delete-log-group --log-group-name "$LOG_GROUP"
          fi

      - name: Delete ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            >/dev/null 2>&1 \
            && aws ecr delete-repository \
              --repository-name "$ECR_REPOSITORY" \
              --force \
            || true
